name: Release

# Adapted from jejezz/application-release-templates desktop/ @ conventions-v1 (the Flutter release workflow), for an
# Avalonia / .NET NativeAOT app. See conventions/ for the rules it implements (tagging.md, versioning.md, workflow.md).
#
# Push a `vX.Y.Z` (or `vX.Y.Z-rc.N`) tag to:
#   1. check         — the tag must equal AppVersion in Directory.Build.props
#   2. build-windows — unit tests, NativeAOT publish, Inno Setup installer + portable zip
#   3. release       — only once every build succeeds, one GitHub Release with every asset plus SHA256SUMS.txt.
#                      If a build fails, nothing is published.
#
# workflow_dispatch runs steps 1–2 only (build check); it never creates a Release (conventions/tagging.md §3).
#
# Windows only for now. NativeAOT must be built on each target OS, so macOS (.app/.dmg, signing, notarization) and
# Linux jobs get added here once the app has been run and verified on those systems.
on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

env:
  # Pin the SDK so re-running a tag rebuilds the same thing (conventions/workflow.md §3). Bump it in a PR.
  DOTNET_VERSION: "10.0.x"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      display_name: ${{ steps.meta.outputs.display_name }}
      file_name: ${{ steps.meta.outputs.file_name }}
      prerelease: ${{ steps.meta.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4

      # Names and version come from Directory.Build.props, the single source (conventions/identity.md §2).
      - name: Read version and names
        id: meta
        run: |
          prop() { sed -n "s:.*<$1>\([^<]*\)</$1>.*:\1:p" Directory.Build.props | head -1 | tr -d '\r'; }
          PROPS_VERSION=$(prop AppVersion)
          DISPLAY_NAME=$(prop AppDisplayName)
          FILE_NAME=$(prop AppFileName)
          test -n "$PROPS_VERSION" && test -n "$DISPLAY_NAME" && test -n "$FILE_NAME"

          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
            if [ "$VERSION" != "$PROPS_VERSION" ]; then
              echo "::error::Tag $GITHUB_REF_NAME does not match AppVersion $PROPS_VERSION in Directory.Build.props"
              exit 1
            fi
          else
            VERSION="$PROPS_VERSION"
          fi

          case "$VERSION" in *-*) PRERELEASE=true ;; *) PRERELEASE=false ;; esac

          {
            echo "version=$VERSION"
            echo "display_name=$DISPLAY_NAME"
            echo "file_name=$FILE_NAME"
            echo "prerelease=$PRERELEASE"
          } >> "$GITHUB_OUTPUT"
          echo "$DISPLAY_NAME $VERSION → $FILE_NAME-$VERSION-* (prerelease: $PRERELEASE)"

  build-windows:
    needs: check
    runs-on: windows-latest
    env:
      FILE_NAME: ${{ needs.check.outputs.file_name }}
      VERSION: ${{ needs.check.outputs.version }}
      DISPLAY_NAME: ${{ needs.check.outputs.display_name }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      # Domain / Data / Services tests. (The Avalonia app project is not unit-tested; it is covered by the publish below.)
      - name: Unit tests
        shell: pwsh
        run: |
          foreach ($t in 'Domain', 'Data', 'Services') {
            dotnet test "tests/DaylightCommander.$t.Tests" -c Release
            if ($LASTEXITCODE -ne 0) { throw "$t tests failed" }
          }

      # NativeAOT needs the MSVC linker; the Windows runner has Visual Studio. The script puts vswhere on PATH.
      - name: Publish (NativeAOT)
        shell: pwsh
        run: ./scripts/publish-aot.ps1

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      # Everything installer/windows/app.iss needs is passed in, so only AppId (a GUID) and the repository URL are
      # edited by hand there.
      - name: Package installer
        shell: bash
        # Git Bash would treat ISCC's /D... switches as POSIX paths and rewrite them. Pass them through unchanged.
        env:
          MSYS_NO_PATHCONV: "1"
          MSYS2_ARG_CONV_EXCL: "*"
        run: |
          # VersionInfoVersion only takes digits: 1.0.0-rc.1 -> 1.0.0
          "/c/Program Files (x86)/Inno Setup 6/ISCC.exe" \
            "/DMyAppName=$DISPLAY_NAME" \
            "/DMyFileName=$FILE_NAME" \
            "/DMyAppVersion=$VERSION" \
            "/DMyAppNumericVersion=${VERSION%%-*}" \
            "/DMyAppExeName=$FILE_NAME.exe" \
            installer/windows/app.iss

      - name: Portable zip
        shell: pwsh
        run: |
          $files = Get-ChildItem publish/aot -File | Where-Object { $_.Extension -ne '.pdb' }
          Compress-Archive -Path $files.FullName -DestinationPath "dist/$env:FILE_NAME-$env:VERSION-windows-x64.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            dist/*-windows-x64-setup.exe
            dist/*-windows-x64.zip
          if-no-files-found: error

  release:
    # Tag pushes only — a manual run is a build check (conventions/tagging.md §3).
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    needs: [check, build-windows]
    permissions:
      contents: write
    steps:
      # For .github/release-notes-header.md (optional install-guide footer).
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        working-directory: dist
        run: sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt

      # Title "<Display Name> vX.Y.Z"; notes = GitHub's generated PR list first, then the install-guide footer
      # (conventions/workflow.md §4). `--generate-notes` always appends after --notes-file, so the notes are generated
      # through the API and assembled here instead.
      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          DISPLAY_NAME: ${{ needs.check.outputs.display_name }}
          PRERELEASE: ${{ needs.check.outputs.prerelease }}
        run: |
          gh api -X POST "repos/$GH_REPO/releases/generate-notes" \
            -f tag_name="$GITHUB_REF_NAME" --jq .body > notes.md
          if [ -f .github/release-notes-header.md ]; then
            printf '\n\n---\n\n' >> notes.md
            cat .github/release-notes-header.md >> notes.md
          fi
          ARGS=(--title "$DISPLAY_NAME $GITHUB_REF_NAME" --notes-file notes.md)
          if [ "$PRERELEASE" = "true" ]; then
            ARGS+=(--prerelease)
          fi
          gh release create "$GITHUB_REF_NAME" dist/* "${ARGS[@]}"
